name: Build Estrella Magica Fugaz

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir zip si existe
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Descomprimiendo $z"
            unzip -o "$z" -d proyecto
          done

      - name: Localizar proyecto
        id: find
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "No se encontro settings.gradle en el repositorio"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: estrella-magica-fugaz-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
